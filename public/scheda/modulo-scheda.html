const MASTER_TESTS_URL = './progressi_test_clienti.json';

function normalizeClientSlug(str) {
  return String(str || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function findClientTestRecord(dataObj, clientQuery) {
  if (!dataObj || typeof dataObj !== 'object') return null;
  const qSlug = normalizeClientSlug(clientQuery);
  const clientsMap = dataObj.clients && typeof dataObj.clients === 'object' ? dataObj.clients : null;

  if (clientsMap) {
    if (qSlug && clientsMap[qSlug]) return clientsMap[qSlug];
    for (const [key, rec] of Object.entries(clientsMap)) {
      const kSlug = normalizeClientSlug(key);
      const aSlug = normalizeClientSlug(rec && rec.athlete ? rec.athlete : '');
      if (qSlug && (kSlug === qSlug || aSlug === qSlug || aSlug.includes(qSlug) || kSlug.includes(qSlug))) {
        return rec;
      }
    }
    if (!qSlug) {
      const firstKey = Object.keys(clientsMap)[0];
      if (firstKey) return clientsMap[firstKey];
    }
  }
  return null;
}

function applyClientTestRecordToState(rec) {
  if (!rec || typeof rec !== 'object') return false;
  if (rec.evalTitle) state.evalTitle = rec.evalTitle;
  if (rec.anthroChartTitle) state.anthroChartTitle = rec.anthroChartTitle;
  if (rec.jumpChartTitle) state.jumpChartTitle = rec.jumpChartTitle;
  if (rec.athlete && (!state.meta || !state.meta.athlete)) {
    state.meta = Object.assign({}, state.meta, { athlete: rec.athlete });
  }
  if (rec.anthro && Array.isArray(rec.anthro.cols) && Array.isArray(rec.anthro.rows)) {
    state.evalData.anthro = JSON.parse(JSON.stringify(rec.anthro));
  }
  if (rec.jumps && Array.isArray(rec.jumps.cols) && Array.isArray(rec.jumps.rows)) {
    state.evalData.jumps = JSON.parse(JSON.stringify(rec.jumps));
  }
  ensureStructures();
  syncMetaFields();
  renderAll();
  saveLocal();
  return true;
}

async function autoLoadClientTestsFromMaster(showToast = false) {
  try {
    const params = new URLSearchParams(window.location.search || '');
    const urlClient = params.get('client') || params.get('atleta') || '';
    const targetClient = urlClient || (state.meta && state.meta.athlete) || '';
    const resp = await fetch(MASTER_TESTS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return false;
    const masterJson = await resp.json();
    const rec = findClientTestRecord(masterJson, targetClient);
    if (rec && applyClientTestRecordToState(rec)) {
      if (showToast) {
        notify(`Test caricati automaticamente dal file master per: ${rec.athlete || targetClient}.`);
      }
      return true;
    }
  } catch (e) {
    // Se aperto in locale tramite file:// senza server web, fetch può essere bloccato dal browser: non blocca la scheda
  }
  return false;
}

function applyImportedState(rawObj, sourceLabel) {
  if (rawObj && rawObj.clients && typeof rawObj.clients === 'object') {
    const params = new URLSearchParams(window.location.search || '');
    const qClient = params.get('client') || (state.meta && state.meta.athlete) || '';
    const rec = findClientTestRecord(rawObj, qClient);
    if (rec && applyClientTestRecordToState(rec)) {
      notify(`Test importati dal file multi-cliente per: ${rec.athlete || qClient}.`);
      return;
    }
  }
  const preservedVocab = [...(state.savedNotes || [])];
  state = Object.assign(defaultState(), rawObj);
  if (Array.isArray(rawObj.savedNotes)) {
    preservedVocab.forEach(oldN => {
      if (!state.savedNotes.some(n => n.text.toLowerCase() === oldN.text.toLowerCase())) {
        state.savedNotes.push(oldN);
      }
    });
  } else {
    state.savedNotes = preservedVocab;
  }
  ensureStructures();
  syncMetaFields();
  renderVocabUI();
  syncFromWorkout(false);
  notify(sourceLabel);
}

function importSchedaFile(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const content = String(e.target.result || '');
      const isHtml = /\.html?$/i.test(file.name) || content.trim().startsWith('<');
      if (isHtml) {
        const doc = new DOMParser().parseFromString(content, 'text/html');
        const dataEl = doc.getElementById('initialData');
        if (!dataEl || !dataEl.textContent.trim()) {
          notify('Nessun dato scheda trovato nel file HTML selezionato.');
          return;
        }
        const parsed = JSON.parse(dataEl.textContent);
        applyImportedState(parsed, `Scheda HTML "${file.name}" caricata e pronta da modificare.`);
      } else {
        const parsed = JSON.parse(content);
        applyImportedState(parsed, `Backup JSON "${file.name}" importato.`);
      }
    } catch (err) {
      notify('Impossibile leggere il file selezionato (HTML/JSON non valido).');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* Parser XLSX (ZIP + XML nativo browser) e CSV per compilazione automatica scheda */
async function readXlsxAsMatrix(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);

  // Trova End of Central Directory (EOCD)
  let eocdOffset = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
    if (view.getUint32(i, true) === 0x06054b50) {
      eocdOffset = i;
      break;
    }
  }
  if (eocdOffset === -1) throw new Error('Archivio XLSX non valido');

  const cdOffset = view.getUint32(eocdOffset + 16, true);
  const cdEntries = view.getUint16(eocdOffset + 10, true);
  const decoder = new TextDecoder('utf-8');
  const entries = {};

  let ptr = cdOffset;
  for (let i = 0; i < cdEntries; i++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) break;
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localHeaderOffset = view.getUint32(ptr + 42, true);
    const name = decoder.decode(bytes.slice(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + commentLen;

    const lNameLen = view.getUint16(localHeaderOffset + 26, true);
    const lExtraLen = view.getUint16(localHeaderOffset + 28, true);
    const dataStart = localHeaderOffset + 30 + lNameLen + lExtraLen;
    const compData = bytes.slice(dataStart, dataStart + compSize);

    if (method === 0) {
      entries[name] = decoder.decode(compData);
    } else if (method === 8) {
      const ds = new DecompressionStream('deflate-raw');
      const writer = ds.writable.getWriter();
      writer.write(compData);
      writer.close();
      const buf = await new Response(ds.readable).arrayBuffer();
      entries[name] = decoder.decode(buf);
    }
  }

  // Leggi sharedStrings.xml se presente
  const sharedStrings = [];
  if (entries['xl/sharedStrings.xml']) {
    const ssDoc = new DOMParser().parseFromString(entries['xl/sharedStrings.xml'], 'application/xml');
    ssDoc.querySelectorAll('si').forEach(si => {
      const tNodes = si.querySelectorAll('t');
      sharedStrings.push(Array.from(tNodes).map(t => t.textContent || '').join(''));
    });
  }

  // Trova il primo foglio di lavoro (xl/worksheets/sheet1.xml)
  const sheetKey = Object.keys(entries)
    .filter(k => /^xl\/worksheets\/sheet\d+\.xml$/i.test(k))
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))[0];
  if (!sheetKey) throw new Error('Nessun foglio trovato nel file Excel');

  const sheetDoc = new DOMParser().parseFromString(entries[sheetKey], 'application/xml');
  const colLettersToIndex = letters => {
    let idx = 0;
    for (let i = 0; i < letters.length; i++) {
      idx = idx * 26 + (letters.charCodeAt(i) - 64);
    }
    return idx - 1;
  };

  const rowsMap = new Map();
  let maxCol = 0;
  sheetDoc.querySelectorAll('sheetData > row').forEach(rowEl => {
    const rNum = parseInt(rowEl.getAttribute('r') || '0', 10);
    if (!rNum) return;
    const rowArr = [];
    rowEl.querySelectorAll('c').forEach(cEl => {
      const ref = cEl.getAttribute('r') || '';
      const colMatch = ref.match(/^([A-Z]+)/i);
      const cIdx = colMatch ? colLettersToIndex(colMatch[1].toUpperCase()) : rowArr.length;
      if (cIdx > maxCol) maxCol = cIdx;
      const type = cEl.getAttribute('t') || '';
      let val = '';
      if (type === 'inlineStr') {
        val = Array.from(cEl.querySelectorAll('t')).map(t => t.textContent || '').join('');
      } else {
        const vNode = cEl.querySelector('v');
        const rawV = vNode ? (vNode.textContent || '') : '';
        if (type === 's') {
          val = sharedStrings[parseInt(rawV, 10)] ?? '';
        } else {
          val = rawV;
        }
      }
      rowArr[cIdx] = String(val).trim();
    });
    rowsMap.set(rNum, rowArr);
  });

  const maxRow = Math.max(0, ...Array.from(rowsMap.keys()));
  const matrix = [];
  for (let r = 1; r <= maxRow; r++) {
    const arr = rowsMap.get(r) || [];
    const full = Array.from({ length: maxCol + 1 }, (_, c) => arr[c] ?? '');
    matrix.push(full);
  }
  return matrix;
}

function parseCsvAsMatrix(text) {
  const lines = String(text || '').split(/\r?\n/).filter(l => l.trim() !== '');
  const sep = (lines[0] && (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length) ? ';' : ',';
  return lines.map(line => line.split(sep).map(c => c.replace(/^"|"$/g, '').trim()));
}

function populateStateFromMatrix(matrix, fileName) {
  const cleanName = fileName.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
  let mainTitle = cleanName.toUpperCase() || 'PROGRAMMA DI ALLENAMENTO';
  let athlete = '';
  let goal = '';
  let dateStr = '';
  let noteStr = '';

  // 1. Cerca titolo/metadati nelle prime righe prima del primo "GIORNO" o "ESERCIZIO"
  for (let r = 0; r < Math.min(5, matrix.length); r++) {
    const nonEmpty = matrix[r].filter(Boolean);
    if (nonEmpty.length === 0) continue;
    const first = nonEmpty[0];
    if (/^(giorno|day|sessione|seduta|esercizio)\b/i.test(first)) break;
    if (r === 0 && nonEmpty.length <= 2) {
      mainTitle = first;
      const parts = first.split('|').map(p => p.trim());
      if (parts.length >= 2) {
        goal = parts[1] || '';
        const dateM = first.match(/(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/);
        if (dateM) dateStr = dateM[1];
      }
    }
  }

  // 2. Individua i blocchi GIORNO / DAY / SEDUTA e le rispettive intestazioni
  const daysParsed = [];
  let detectedWeekLabels = null;
  let currentDay = null;
  let colMap = { ex: 0, rest: 1, note: 2, weekStart: 3, weekEnd: 10 };

  for (let r = 0; r < matrix.length; r++) {
    const row = matrix[r];
    if (!row.some(Boolean)) continue;
    const c0 = String(row[0] || '').trim();

    // Intestazione blocco giornata (es. "GIORNO 1", "DAY 2", "SEDUTA A")
    if (/^(giorno|day|seduta|sessione|workout)\s*[0-9a-zA-Z]+/i.test(c0) && !row[1]) {
      if (currentDay && currentDay.rows.length > 0) daysParsed.push(currentDay);
      currentDay = { title: c0.toUpperCase(), rows: [] };
      continue;
    }

    // Riga intestazione tabella (es. Esercizio | Rest | Note | W1 | W2...)
    const exColIdx = row.findIndex(cell => /^(esercizio|exercise|movimento)$/i.test(String(cell || '').trim()));
    if (exColIdx !== -1) {
      if (!currentDay) {
        currentDay = { title: `GIORNO ${daysParsed.length + 1}`, rows: [] };
      }
      const restIdx = row.findIndex((cell, i) => i > exColIdx && /^(rest|rec|recupero|pausa)$/i.test(String(cell || '').trim()));
      const noteIdx = row.findIndex((cell, i) => i > exColIdx && /^(note|tempo|tut|indicazioni|note\s*\/\s*tempo)$/i.test(String(cell || '').trim()));
      const wStart = Math.max(exColIdx + 1, restIdx + 1, noteIdx + 1);

      // Raccogli etichette settimane fino a prima di eventuali colonne ausiliarie duplicate (es. seconda "W1" dopo W8)
      const wLabels = [];
      let wEnd = wStart - 1;
      for (let c = wStart; c < row.length; c++) {
        const lbl = String(row[c] || '').trim();
        if (!lbl) break;
        if (wLabels.length > 0 && wLabels.some(existing => existing.toLowerCase() === lbl.toLowerCase())) break;
        wLabels.push(lbl);
        wEnd = c;
      }

      colMap = { ex: exColIdx, rest: restIdx, note: noteIdx, weekStart: wStart, weekEnd: wEnd };
      if (wLabels.length > 0 && (!detectedWeekLabels || wLabels.length > detectedWeekLabels.length)) {
        detectedWeekLabels = wLabels;
      }
      continue;
    }

    // Riga esercizio dentro un giorno
    if (currentDay && c0 && !/^(totale|volume|tonnellaggio|carico\s+usato)/i.test(c0)) {
      const exVal = String(row[colMap.ex] || '').trim();
      if (!exVal) continue;
      const restVal = colMap.rest >= 0 ? String(row[colMap.rest] || '').trim() : '';
      const noteVal = colMap.note >= 0 ? String(row[colMap.note] || '').trim() : '';
      const weeksArr = [];
      for (let c = colMap.weekStart; c <= colMap.weekEnd; c++) {
        weeksArr.push(String(row[c] || '').trim());
      }
      currentDay.rows.push({
        ex: exVal,
        rest: restVal,
        note: noteVal,
        weeks: weeksArr,
        hidden: false
      });
    }
  }
  if (currentDay && currentDay.rows.length > 0) daysParsed.push(currentDay);

  if (daysParsed.length === 0) {
    notify('Nessuna tabella esercizi riconosciuta nel file Excel. Verifica che ci sia la colonna "Esercizio".');
    return;
  }

  const weekLabels = (detectedWeekLabels && detectedWeekLabels.length > 0) ? detectedWeekLabels : [...DEFAULT_WEEKS];
  const wCount = weekLabels.length;

  // Normalizza lunghezza settimane e nascondi colonne completamente vuote in tutte le giornate (se >= 4 settimane)
  const colHasAnyValue = Array.from({ length: wCount }, (_, w) =>
    daysParsed.some(d => d.rows.some(r => Boolean(r.weeks[w])))
  );
  const firstEmptyTail = colHasAnyValue.findIndex((has, idx) => idx >= 3 && !has && colHasAnyValue.slice(idx).every(x => !x));

  const preservedVocab = [...(state.savedNotes || [])];
  const newState = defaultState();
  newState.savedNotes = preservedVocab;
  newState.mainTitle = mainTitle;
  newState.meta = { athlete, goal, date: dateStr, note: noteStr };
  newState.weekLabels = weekLabels;
  newState.split = Math.min(6, Math.max(2, daysParsed.length));

  // Popola giornate
  for (let d = 0; d < 6; d++) {
    if (daysParsed[d]) {
      const hiddenCols = Array.from({ length: wCount }, (_, w) => firstEmptyTail !== -1 && w >= firstEmptyTail);
      newState.days[d] = {
        title: daysParsed[d].title,
        hiddenCols,
        collapsed: false,
        rows: daysParsed[d].rows.map(r => {
          const wFull = makeWeekArr(wCount, '');
          r.weeks.forEach((val, idx) => { if (idx < wCount) wFull[idx] = val; });
          // Salva eventuali note ricorrenti nel vocabolario
          if (r.note && !newState.savedNotes.some(n => n.text.toLowerCase() === r.note.toLowerCase())) {
            newState.savedNotes.push({ text: r.note, count: 1 });
          }
          return { ex: r.ex, rest: r.rest, note: r.note, weeks: wFull, hidden: false };
        })
      };
    } else {
      newState.days[d] = makeOneEmptyDay(d, wCount);
    }
  }

  // Rileva automaticamente gli esercizi a CARICO (kg) e a RIPETIZIONI (rep) per popolare i grafici!
  const autoKg = [];
  const autoRep = [];
  const seenEx = new Set();

  daysParsed.forEach(d => {
    d.rows.forEach(r => {
      const cleanEx = r.ex.replace(/^\d+\s*[-.)]\s*/, '').trim();
      const normKey = cleanEx.toLowerCase();
      if (!cleanEx || seenEx.has(normKey)) return;
      const hasKg = r.weeks.some(w => extractKg(w) !== null);
      const hasRep = r.weeks.some(w => parseRepCellDetails(w, `${r.ex} ${r.note}`) !== null);
      if (hasKg) {
        seenEx.add(normKey);
        autoKg.push({
          id: `kg_${autoKg.length + 1}`,
          label: cleanEx,
          color: PALETTE[autoKg.length % PALETTE.length],
          values: makeWeekArr(wCount, '')
        });
      } else if (hasRep && !/^(drop\s+dal\s+box|salti|rotazioni)/i.test(cleanEx)) {
        seenEx.add(normKey);
        autoRep.push({
          id: `rep_${autoRep.length + 1}`,
          label: cleanEx,
          color: PALETTE[autoRep.length % PALETTE.length],
          values: makeWeekArr(wCount, '')
        });
      }
    });
  });

  if (autoKg.length > 0) newState.kgItems = autoKg.slice(0, 8);
  if (autoRep.length > 0) newState.repItems = autoRep.slice(0, 8);

  state = newState;
  ensureStructures();
  syncMetaFields();
  renderVocabUI();
  syncFromWorkout(false);
  notify(`Excel "${fileName}" importato: ${daysParsed.length} giornate e ${autoKg.length + autoRep.length} esercizi tracciati nei grafici.`);
}

async function importExcelFile(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  try {
    let matrix = [];
    if (/\.csv$/i.test(file.name)) {
      const txt = await file.text();
      matrix = parseCsvAsMatrix(txt);
    } else {
      const buf = await file.arrayBuffer();
      matrix = await readXlsxAsMatrix(buf);
    }
    populateStateFromMatrix(matrix, file.name);
  } catch (err) {
    console.error(err);
    notify('Errore nella lettura del file Excel/CSV. Assicurati che sia un file .xlsx o .csv valido.');
  }
  ev.target.value = '';
}

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Scheda_${(state.meta.athlete || 'Base').replace(/\s+/g, '_')}.html`;

<!-- S&C FP Hub bridge: saves into the athlete folder when the sheet is opened inside the app -->
<script id="hubBridge">
(function () {
  if (window.parent === window) return;
  var SEED = /*__SHEET_SEED__*/null;
  var READ_ONLY = /*__SHEET_READONLY__*/false;
  var timer = null;
  var memorySnapshot = null;
  var DEFAULT_TITLE = 'PROGRAMMA DI ALLENAMENTO — BASE VUOTA';

  loadLocal = function () {
    try {
      var embText = document.getElementById('initialData').textContent;
      if (embText && embText.trim() !== 'null') {
        state = Object.assign(defaultState(), JSON.parse(embText));
      }
    } catch (e) {}
    if (SEED && state && state.meta) {
      if (!state.meta.athlete && SEED.athlete) state.meta.athlete = SEED.athlete;
      if (!state.meta.goal && SEED.goal) state.meta.goal = SEED.goal;
      if (!state.meta.date && SEED.date) state.meta.date = SEED.date;
      if ((!state.mainTitle || state.mainTitle === DEFAULT_TITLE) && SEED.title) state.mainTitle = SEED.title;
    }
    ensureStructures();
  };

  saveLocal = function () {
    try {
      var emb = document.getElementById('initialData');
      if (emb) emb.textContent = JSON.stringify(state);
      if (READ_ONLY) return;
      clearTimeout(timer);
      timer = setTimeout(function () {
        window.parent.postMessage({ type: 'hub-sheet:save', state: JSON.parse(JSON.stringify(state)) }, '*');
      }, 900);
    } catch (e) {}
  };

  savePreviousSnapshotBeforeClear = function () {
    memorySnapshot = { savedAt: new Date().toLocaleString('it-IT'), data: JSON.parse(JSON.stringify(state)) };
    updateRestoreBackupButton();
  };
  getPreviousSnapshot = function () { return memorySnapshot; };
  autoLoadClientTestsFromMaster = async function () { return false; };

  window.addEventListener('message', function (ev) {
    if (ev.source !== window.parent || !ev.data) return;
    if (ev.data.type === 'hub-sheet:error') notify('Modifiche NON salvate nella cartella: controlla la connessione e riprova.');
  });

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      window.parent.postMessage({ type: 'hub-sheet:ready' }, '*');
    }, 0);
  });
})();
</script>
</body></html>
